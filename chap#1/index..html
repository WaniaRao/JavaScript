<!DOCTYPE html>
<html>
<head>

    <title>JavaScript Assignment #1</title>

    <!-- Q7 (a) Script in Head -->
    <script>
        alert("Welcome to My Online Store!");
    </script>

</head>

<body>

    <!-- Q7 (b) Script at the beginning of Body -->
    <script>
        alert("Thanks for visiting our store!");
    </script>


    <h1>My Online Shopping Store</h1>

    <h2>JavaScript Alerts</h2>


    <!-- Q1 -->
    <h3>Q1. Welcome Message</h3>

    <script>
        alert("Welcome to My Online Store!");
    </script>


    <!-- Q2 -->
    <h3>Q2. Shopping Reminder</h3>

    <script>
        alert("Please check your shopping cart before checkout.");
    </script>


    <!-- Q3 -->
    <h3>Q3. Message with Line Break</h3>

    <script>
        alert("Your order has been received.\nThank you for shopping with us!");
    </script>


    <!-- Q4 -->
    <h3>Q4. Messages in Sequence</h3>

    <script>
        alert("Your order is being processed.");
        alert("You will receive your order soon!");
    </script>


    <!-- Q5 -->
    <h3>Q5. Browser Developer Console</h3>

    <p>Open the browser console to see the message.</p>

    <script>
        console.log("Welcome to our Online Store!");
    </script>


    <!-- Q6 -->
    <h3>Q6. Alert in My Website</h3>

    <button onclick="alert('Thank you for visiting our store!')">
        Shop Now
    </button>


    <!-- Q7 (c) Script inside Body HTML -->
    <script>
        alert("Enjoy shopping on our website!");
    </script>


    <!-- Q7 (d) Script after page HTML -->
    <script>
        alert("Thank you for visiting our store!");
    </script>

</body>
</html>
